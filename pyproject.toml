[project]
name = "cmdlabs-qna-ingest-cloud-function"
version = "0.1.0"
description = "Cloud Function for ingesting QnA knowledge stored in a .csv into a Pinecone Vector DB"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "google-cloud-storage>=2.10.0",
    "pinecone>=5.0.0",
    "requests>=2.31.0",
    "functions-framework>=3.5.0",
    "flask>=3.0.0",
    "sqlalchemy>=2.0.0",
    "cryptography>=42.0.0",
    "psycopg[binary]>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helpers", "clients", "singletons", "db"]
# Include root-level Python files
include = [
    "main.py",
]

